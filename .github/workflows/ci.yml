name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # KNord targets current KF6; Arch tracks it closest, and the container keeps
    # the CI toolchain identical to what the AUR package builds against.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base qt6-declarative qt6-tools \
            kirigami kirigami-addons ki18n kcoreaddons kconfig \
            knotifications kiconthemes kstatusnotifieritem kwindowsystem \
            qqc2-desktop-style

      - uses: actions/checkout@v4

      - name: Trust the workspace
        # The container runs as root while the checkout is owned by the runner
        # user, which git otherwise refuses to touch.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Verify the install tree
        run: |
          DESTDIR="$PWD/staging" cmake --install build --prefix /usr
          find staging -type f | sort
          # The desktop entry's Icon= must resolve to an installed icon,
          # otherwise the launcher shows a blank tile.
          test -x staging/usr/bin/knord
          test -f staging/usr/share/applications/io.github.timpalpant.knord.desktop
          test -f staging/usr/share/metainfo/io.github.timpalpant.knord.metainfo.xml
          test -f staging/usr/share/icons/hicolor/scalable/apps/io.github.timpalpant.knord.svg

  lint:
    name: QML and metadata
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base qt6-declarative qt6-tools \
            kirigami kirigami-addons ki18n kcoreaddons kconfig \
            knotifications kiconthemes kstatusnotifieritem kwindowsystem \
            qqc2-desktop-style appstream desktop-file-utils

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate the desktop entry
        run: desktop-file-validate data/io.github.timpalpant.knord.desktop

      - name: Validate the AppStream metadata
        # --no-net because the checks that hit the network are flaky in CI and
        # would fail on URLs that are fine but rate-limited.
        run: appstreamcli validate --no-net --pedantic data/io.github.timpalpant.knord.metainfo.xml

      - name: qmllint
        # The tree is expected to be silent; qmllint warnings are failures.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target all_qmllint

  format:
    name: Formatting
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git clang

      - uses: actions/checkout@v4

      - name: Check clang-format
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git \
            qt6-base qt6-declarative \
            kirigami kirigami-addons ki18n kcoreaddons kconfig \
            knotifications kiconthemes kstatusnotifieritem kwindowsystem \
            qqc2-desktop-style breeze-icons

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build

      # Loads every QML page with no nordvpn binary present, which is also the
      # "NordVPN is not installed" path users hit on a fresh machine. Any QML
      # type or binding error shows up here as a warning line.
      - name: Load the QML scene headlessly
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          timeout 20 ./build/knord > out.log 2>&1 || true
          cat out.log
          if grep -Eq 'is not a type|Cannot assign|ReferenceError|Binding loop|Cannot create delegate' out.log; then
            echo "::error::QML errors detected"
            exit 1
          fi

  packaging:
    name: Packaging files
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git pacman-contrib \
            qt6-base qt6-declarative qt6-tools \
            kirigami kirigami-addons ki18n kcoreaddons kconfig \
            knotifications kiconthemes kstatusnotifieritem kwindowsystem \
            qqc2-desktop-style

      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint the PKGBUILDs
        run: |
          useradd -m builder
          chown -R builder .
          for dir in packaging/aur/*/; do
            echo "== $dir"
            bash -n "$dir/PKGBUILD"
            su builder -c "cd '$dir' && makepkg --printsrcinfo > /dev/null"
          done

      # The release package downloads a fixed tarball, so it has to verify it.
      # SKIP belongs only to knord-git, whose source is a git checkout.
      - name: Check the release tarball is pinned by digest
        run: |
          if grep -q "^sha256sums=('SKIP')" packaging/aur/knord/PKGBUILD; then
            echo "::error::packaging/aur/knord/PKGBUILD downloads a tarball without checking it"
            exit 1
          fi

      # Builds the pacman package the release ships, from this commit, so a
      # broken PKGBUILD surfaces here rather than while cutting a release.
      # `nordvpn` is a virtual runtime dependency supplied by an AUR package,
      # so the official Arch CI image preinstalls build dependencies and skips
      # only dependency resolution while it builds this package.
      - name: Build the pacman package
        run: ./packaging/build-arch-package.sh --nodeps --outdir "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: knord-pacman-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately not the bilelmoussaoui/flatpak-github-actions container:
      # its published tags stop at kde-6.7 and this app targets the 6.9 runtime,
      # so that image cannot be pulled. Installing flatpak directly works for
      # any runtime version.
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the KDE runtime
        run: |
          flatpak install --user --noninteractive flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Cache the flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-

      - name: Build
        # The CI manifest builds this checkout; the tagged one is for Flathub.
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo build-flatpak \
            packaging/flatpak/io.github.timpalpant.knord.ci.yml

      - name: Create the bundle
        run: |
          flatpak build-bundle flatpak-repo knord.flatpak \
            io.github.timpalpant.knord

      - uses: actions/upload-artifact@v4
        with:
          name: knord-flatpak
          path: knord.flatpak
          if-no-files-found: error
