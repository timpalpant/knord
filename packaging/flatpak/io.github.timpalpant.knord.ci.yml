# Same as io.github.timpalpant.knord.yml, but builds the working tree instead of
# a published tag. Used by CI and for local `flatpak-builder` runs; the Flathub
# submission uses the tagged manifest.
id: io.github.timpalpant.knord
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: knord

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # See the tagged manifest for why this is unavoidable.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: knord
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
