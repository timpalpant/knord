id: io.github.timpalpant.knord
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: knord

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Opening the Nord Account sign-in page during login.
  - --share=network
  # Tray icon (StatusNotifierItem) and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  #
  # KNord is a front end for the NordVPN client, which is installed on the host
  # and talks to a root daemon over /run/nordvpn/nordvpnd.sock. The client
  # cannot be bundled: it is proprietary and requires a systemd system service.
  # Every command therefore runs through `flatpak-spawn --host nordvpn ...`,
  # which needs this permission. It is a broad one, and the sandboxing caveat is
  # stated plainly in the app description and README.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: knord
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/timpalpant/knord.git
        tag: v0.1.0
